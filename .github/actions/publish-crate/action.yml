name: 'Publish crate'
description: 'Publish crate to crates.io'

inputs:
  publish:
    description: 'Whether to publish (false for dry-run)'
    required: false
    default: 'false'
  nightly-release:
    description: 'Whether this is a nightly release'
    required: false
    default: 'true'
  cargo-registry-token:
    description: 'Token for publishing to crates.io'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Setup environment
      uses: ./.github/actions/setup-environment
      with:
        # Precautionary headroom on the GitHub-hosted ubuntu-latest runner
        # (Linux-only, no-op elsewhere). Publishing runs with --no-verify (the
        # rolling `package` gate already verify-built the workspace on this SHA),
        # so this need not fit a full rocksdb + wasm-opt rebuild; kept as cheap
        # insurance against packaging many large crates.
        free-disk-space: 'true'

    # No CARGO_REGISTRY_TOKEN here: `cargo publish --dry-run` never contacts the
    # registry to upload, so the crates.io token is deliberately kept OUT of
    # scope for dry-runs (and for the nightly path, which only ever dry-runs).
    - name: Publish the crate (dry-run)
      if: ${{ inputs.publish == 'false' || inputs.nightly-release == 'true' }}
      shell: bash
      run: |
        set -x

        # Create a temporary branch in case the git ref is not a branch.
        git checkout -b crate 2>/dev/null || true

        echo "Running cargo publish --workspace --dry-run --no-verify"
        echo "Note: Failures here are informational and do not block nightly builds"
        echo "Common cause: workspace crates with new APIs not yet published"

        # --no-verify: the rolling `package` gate already ran
        # `cargo package --locked --workspace` on this SHA (build-once /
        # promote-many), so skip the redundant per-crate rebuild. This stays a
        # cheap name/version/registry sanity check on top of that gate.
        cargo publish --workspace --dry-run --no-verify

    # Real publish — cargo only, no release-plz and no forge/GitHub token.
    #
    # Publishes to crates.io in dependency order with bounded retries and an
    # idempotent skip, reproducing the only two behaviours release-plz gave us
    # (transient-failure retries + skip-already-published) on top of cargo's own
    # per-crate index-wait. `cargo publish -p <crate>` blocks until the crate is
    # visible in the registry index before returning, so each dependent resolves
    # its just-published dependency on the next iteration — that wait is what a
    # bare `cargo publish --workspace` used to race. Only CARGO_REGISTRY_TOKEN is
    # required; no --git-token, no pull-requests scope, no PR-association calls.
    - name: Publish the crate
      if: ${{ inputs.publish == 'true' && inputs.nightly-release != 'true' }}
      shell: bash
      env:
        CARGO_REGISTRY_TOKEN: ${{ inputs.cargo-registry-token }}
      run: |
        set -uo pipefail

        # Detached HEAD at the released SHA — give cargo a branch to sit on.
        git checkout -b crate 2>/dev/null || true

        meta="$(cargo metadata --format-version 1 --no-deps)"

        # Publishable members: `.publish` is null (unset -> publishable) or a
        # non-empty registry list; `[]` means `publish = false` (skip).
        mapfile -t PUBLISHABLE < <(printf '%s' "$meta" \
          | jq -r '.packages[] | select(.publish != []) | .name' | sort -u)
        if [ "${#PUBLISHABLE[@]}" -eq 0 ]; then
          echo "No publishable crates in the workspace."; exit 0
        fi

        # Dependency-order the members: emit "<dep> <pkg>" for every non-dev
        # dependency that is itself a workspace member, then tsort (deps first).
        # tsort only lists nodes present in an edge, so publishable members with
        # no internal edges are appended afterwards (their order is free).
        edges="$(printf '%s' "$meta" | jq -r '
          [.packages[].name] as $names
          | .packages[] as $pkg
          | $pkg.dependencies[]?
          | select(.kind != "dev")
          | .name
          | select(. as $d | $names | index($d))
          | "\(.) \($pkg.name)"')"
        mapfile -t ORDERED < <(printf '%s\n' "$edges" | tsort 2>/dev/null)

        is_publishable() { local x; for x in "${PUBLISHABLE[@]}"; do [ "$x" = "$1" ] && return 0; done; return 1; }
        in_list() { local x t="$1"; shift; for x in "$@"; do [ "$x" = "$t" ] && return 0; done; return 1; }

        ORDER=()
        for c in "${ORDERED[@]}"; do is_publishable "$c" && ORDER+=("$c"); done
        for c in "${PUBLISHABLE[@]}"; do in_list "$c" "${ORDER[@]}" || ORDER+=("$c"); done

        crate_version() {
          printf '%s' "$meta" | jq -r --arg n "$1" '.packages[] | select(.name==$n) | .version'
        }

        # Is <name>@<version> already on crates.io? Query the sparse index
        # (authoritative and fast; `cargo search` is cache-stale). Path layout:
        # 1|2-char names -> 1/ or 2/ dirs, 3-char -> 3/<c1>, else <c1c2>/<c3c4>.
        # The index lowercases names.
        is_published() {
          local name ver p
          name="$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')"; ver="$2"
          case "${#name}" in
            1) p="1/${name}" ;;
            2) p="2/${name}" ;;
            3) p="3/${name:0:1}/${name}" ;;
            *) p="${name:0:2}/${name:2:2}/${name}" ;;
          esac
          curl -fsSL "https://index.crates.io/${p}" 2>/dev/null \
            | jq -e --arg v "$ver" 'select(.vers == $v)' >/dev/null 2>&1
        }

        MAX_ATTEMPTS=5
        BACKOFF=30

        # Publish one crate: skip if already on crates.io, else cargo publish
        # with bounded retries + backoff for transient failures (network, 429,
        # 5xx, index-propagation timeout). "Already uploaded" (from a partial
        # earlier run or a mid-retry race) counts as success — publishes are
        # irreversible, so this idempotency is what makes re-runs safe.
        publish_one() {
          local c="$1" v a=1 out rc
          v="$(crate_version "$c")"
          if [ -z "$v" ] || [ "$v" = "null" ]; then echo "::error::could not resolve version for ${c}"; return 1; fi
          if is_published "$c" "$v"; then echo "skip ${c}@${v} (already on crates.io)"; return 0; fi
          while :; do
            echo "Publishing ${c}@${v} (attempt ${a}/${MAX_ATTEMPTS})"
            out="$(cargo publish -p "$c" --no-verify 2>&1)"; rc=$?
            printf '%s\n' "$out"
            [ "$rc" -eq 0 ] && { echo "published ${c}@${v}"; return 0; }
            if printf '%s' "$out" | grep -qiE 'already (uploaded|exists)|is already uploaded|already published'; then
              echo "${c}@${v} already on crates.io — treating as success"; return 0
            fi
            if is_published "$c" "$v"; then echo "${c}@${v} present after attempt ${a} — treating as success"; return 0; fi
            if [ "$a" -ge "$MAX_ATTEMPTS" ]; then echo "::error::failed to publish ${c}@${v} after ${MAX_ATTEMPTS} attempts"; return 1; fi
            echo "::warning::publish ${c}@${v} attempt ${a} failed; retrying in ${BACKOFF}s"
            a=$((a + 1)); sleep "$BACKOFF"
          done
        }

        echo "Publish order: ${ORDER[*]}"
        for c in "${ORDER[@]}"; do
          publish_one "$c" || exit 1
        done
        echo "All publishable crates are on crates.io."
